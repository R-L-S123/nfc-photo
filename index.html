<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️ תמונה מיוחדת ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #4a1045 0%,
                    #21001d 45%,
                    #0d000b 100%
                );

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           התוכן המרכזי
           ========================= */

        .container {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 8px;

            z-index: 3;
        }

        /* =========================
           הכותרת
           ========================= */

        h1 {
            width: 100%;

            padding: 0 15px;
            margin: 0;

            text-align: center;

            color: white;

            font-size: clamp(22px, 6vw, 36px);

            text-shadow:
                0 0 8px #ff69b4,
                0 0 18px #ff1493,
                0 0 30px #ff1493;

            z-index: 5;
        }

        /* =========================
           התמונה
           ========================= */

        .photo {
            width: min(92vw, 480px);
            height: min(92vw, 480px);

            object-fit: cover;

            border-radius: 25px;

            border: 5px solid white;

            box-shadow:
                0 0 15px #ff69b4,
                0 0 35px #ff1493,
                0 0 70px rgba(255, 20, 147, 0.7);

            z-index: 4;
        }

        /* =========================
           לבבות
           ========================= */

        .heart {
            position: fixed;

            bottom: -60px;

            font-size: 30px;

            pointer-events: none;

            animation:
                floatUp 7s linear infinite;

            z-index: 1;
        }

        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.8);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(-50vh)
                    rotate(180deg)
                    scale(1);
            }

            90% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-120vh)
                    rotate(360deg)
                    scale(1.2);

                opacity: 0;
            }
        }

        /* =========================
           נצנצים
           ========================= */

        .sparkle {
            position: fixed;

            color: white;

            font-size: 25px;

            pointer-events: none;

            animation:
                sparkleAnimation 2s ease-in-out infinite alternate;

            z-index: 1;
        }

        @keyframes sparkleAnimation {

            from {
                opacity: 0.2;
                transform:
                    scale(0.5)
                    rotate(0deg);
            }

            to {
                opacity: 1;
                transform:
                    scale(1.4)
                    rotate(90deg);
            }
        }

        /* =========================
           טלפונים קטנים
           ========================= */

        @media (max-height: 700px) {

            .container {
                gap: 6px;
            }

            h1 {
                font-size: 21px;
            }

            .photo {
                width: 82vw;
                height: 82vw;
            }
        }

        /* =========================
           טלפונים גבוהים
           ========================= */

        @media (min-height: 800px) and (max-width: 600px) {

            .container {
                gap: 8px;
            }

            h1 {
                font-size: 24px;
            }

            .photo {
                width: 88vw;
                height: 88vw;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         תוכן האתר
         ========================= -->

    <div class="container">

        <h1>
            ❤️ תמונה מיוחדת, כמעט כמוך 😉
        </h1>

        <img
            src="Noya.jpg"
            class="photo"
            alt="תמונה מיוחדת"
        >

    </div>


    <!-- =========================
         ❤️ לבבות
         ========================= -->

    <div class="heart" style="left: 5%; animation-delay: 0s;">
        ❤️
    </div>

    <div class="heart" style="left: 20%; animation-delay: 2s;">
        💕
    </div>

    <div class="heart" style="left: 35%; animation-delay: 4s;">
        💗
    </div>

    <div class="heart" style="left: 55%; animation-delay: 1s;">
        ❤️
    </div>

    <div class="heart" style="left: 72%; animation-delay: 3s;">
        💖
    </div>

    <div class="heart" style="left: 88%; animation-delay: 5s;">
        💕
    </div>


    <!-- =========================
         ✨ נצנצים
         ========================= -->

    <div class="sparkle" style="top: 15%; left: 10%;">
        ✦
    </div>

    <div class="sparkle" style="top: 25%; left: 88%;">
        ✧
    </div>

    <div class="sparkle" style="top: 55%; left: 7%;">
        ✦
    </div>

    <div class="sparkle" style="top: 70%; left: 92%;">
        ✧
    </div>

    <div class="sparkle" style="top: 85%; left: 18%;">
        ✦
    </div>

    <div class="sparkle" style="top: 80%; left: 80%;">
        ✧
    </div>

</body>
</html>
